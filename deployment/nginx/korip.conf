# api.korip.me - Django 백엔드 도메인
server {
    server_name api.korip.me;

    location /static/ {
        alias /home/ubuntu/korip-backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /home/ubuntu/korip-backend/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        # CORS preflight 처리
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://www.korip.me';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Content-Type' 'text/plain; charset=utf-8';

            add_header 'Content-Length' 0;
            return 204;
        }

        # 일반 요청에 CORS 헤더 추가
        add_header 'Access-Control-Allow-Origin' 'https://www.korip.me' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host "api.korip.me";  # api.korip.me가 전달됨
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;  # HTTPS임을 알려줌
        proxy_set_header X-Forwarded-Host $host;   # api.korip.me 전달
        proxy_set_header X-Forwarded-Port 443;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.korip.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.korip.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# api.korip.me HTTP -> HTTPS 리다이렉트
server {
    if ($host = api.korip.me) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name api.korip.me;
    return 404;
}
